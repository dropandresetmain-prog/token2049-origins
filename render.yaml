# Rehearsal deployment configuration. Deploy the exact tested SHA; auto-deploy stays off.
# The existing database is provisioned separately; paste its private/internal URL into DATABASE_URL.
services:
  - type: web
    name: token2049-origins
    runtime: docker
    branch: main
    region: singapore
    plan: free
    autoDeployTrigger: 'off'
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: APP_ENV
        value: sandbox
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8787
      # Public Storefront authentication; leave the short-lived private delegate unset.
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_API_VERSION
        value: '2026-10'
      - key: SHOPIFY_STOREFRONT_TOKEN
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_STORE_PASSWORD
        sync: false
      - key: SHOPIFY_DEV_STORE_CONFIRMED
        value: 'true'
      - key: SHOPIFY_BOGUS_GATEWAY_ENABLED
        value: 'true'
      - key: SHOPIFY_HEADLESS
        value: 'true'
      - key: SHOPIFY_SANDBOX_PUBLICATION_ID
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: NUITEE_API_KEY
        sync: false
      - key: NUITEE_SEARCH_BASE_URL
        value: https://api.liteapi.travel/v3.0
      - key: NUITEE_BOOKING_BASE_URL
        value: https://book.liteapi.travel/v3.0
      - key: ATLAS_BASE_URL
        sync: false
      - key: ATLAS_CLIENT_ID
        sync: false
      - key: ATLAS_CLIENT_SECRET
        sync: false
      # Receive-only gateway configuration. Bearer token is a Render secret file;
      # payer/sponsor keys and protected ledgers stay on the local facilitator host.
      - key: SOLANA_NETWORK
        value: devnet
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: SOLANA_USDC_MINT
        value: 4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU
      - key: SOLANA_ASSET_DECIMALS
        value: '6'
      - key: SOLANA_TREASURY_ADDRESS
        sync: false
      - key: SOLANA_TREASURY_TOKEN_ACCOUNT
        sync: false
      - key: SOLANA_FEE_PAYER_ADDRESS
        sync: false
      - key: SOLANA_FACILITATOR_URL
        sync: false
      - key: SOLANA_FACILITATOR_TRUSTED_ORIGIN
        sync: false
      - key: SOLANA_FACILITATOR_TOKEN_FILE
        value: /etc/secrets/solana-facilitator-token
      - key: SOLANA_MAX_PAYMENT_BASE_UNITS
        value: '10000'
      - key: OCBC_API_CLIENT_ID
        sync: false
      - key: OCBC_API_CLIENT_SECRET
        sync: false
      - key: OCBC_API_BASE_URL
        sync: false
      - key: OCBC_API_CALLS_PER_MINUTE
        value: '5'
      - key: OCBC_SANDBOX_SESSION_TOKEN
        sync: false
      # Receive-only Preprod verifier. Payer keys/bridge/ledger never belong on Render.
      - key: CARDANO_NETWORK
        value: cardano:preprod
      - key: CARDANO_FACILITATOR_URL
        sync: false
      - key: CARDANO_TREASURY_ADDRESS
        sync: false
      - key: CARDANO_ASSET_UNIT
        sync: false
      - key: CARDANO_ASSET_DECIMALS
        value: '6'
      - key: BLOCKFROST_PROJECT_ID
        sync: false
      - key: BLOCKFROST_BASE_URL
        value: https://cardano-preprod.blockfrost.io/api/v0
      - key: ATLAS_ALLOW_TEST_BALANCE_PAYMENT
        value: 'false'
      # Hosted MCP at POST /mcp on this same service (one public port). Opt-in; OAuth 2.1 protects every call.
      # PUBLIC_BASE_URL above must be exactly this origin: the payer validates 402 challenges against it.
      - key: MCP_HOSTED_ENABLED
        value: 'true'
      - key: MCP_PUBLIC_URL
        value: https://token2049-origins.onrender.com
      # Render secret files (dashboard -> Environment -> Secret Files). Never environment values.
      - key: MCP_OAUTH_OWNER_PASSCODE_FILE
        value: /etc/secrets/mcp-owner-passcode
      # Hosted Cardano payer on the private network. The bridge token is a secret file shared with the payer service.
      - key: CARDANO_PAYER_BRIDGE_URL
        value: http://t2o-cardano-payer:8788
      - key: CARDANO_PAYER_BRIDGE_TOKEN_FILE
        value: /etc/secrets/cardano-payer-bridge-token

  # Dedicated hosted Cardano Preprod payer. PRIVATE SERVICE: no public URL. Needs a paid instance plus a persistent disk
  # (the spend ledger must survive restarts and redeploys). Same region + workspace as the web service is required.
  - type: pserv
    name: t2o-cardano-payer
    runtime: docker
    dockerfilePath: ./Dockerfile.payer
    branch: main
    region: singapore
    plan: starter
    autoDeployTrigger: 'off'
    disk:
      name: payer-ledger
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: '8788'
      - key: PAYER_BRIDGE_PORT
        value: '8788'
      # Exact host:port the web service uses to reach this bridge.
      - key: PAYER_BRIDGE_ALLOWED_HOSTS
        value: t2o-cardano-payer:8788
      - key: PAYER_BRIDGE_TOKEN_FILE
        value: /etc/secrets/cardano-payer-bridge-token
      # The payer reads the 402 challenge from the PUBLIC gateway URL (must equal PUBLIC_BASE_URL) with a payer-scoped token.
      - key: PAYER_GATEWAY_URL
        value: https://token2049-origins.onrender.com
      - key: PAYER_GATEWAY_TOKEN_FILE
        value: /etc/secrets/payer-gateway-token
      - key: PAYER_CARDANO_NETWORK
        value: cardano:preprod
      - key: PAYER_CARDANO_MNEMONIC_FILE
        value: /etc/secrets/payer-cardano-mnemonic
      - key: PAYER_LEDGER_FILE
        value: /var/data/payer-ledger.json
      - key: BLOCKFROST_PROJECT_ID
        sync: false
      - key: BLOCKFROST_BASE_URL
        value: https://cardano-preprod.blockfrost.io/api/v0
      - key: PAYER_ALLOWED_ASSET_UNIT
        sync: false
      - key: PAYER_EXPECTED_PAY_TO
        sync: false
      # Hard small caps (base units of the allowed asset, 6 decimals). Cumulative never resets.
      - key: PAYER_MAX_PER_PAYMENT_BASE_UNITS
        value: '500000'
      - key: PAYER_MAX_CUMULATIVE_BASE_UNITS
        value: '1500000'
      - key: PAYER_MAX_DAILY_BASE_UNITS
        value: '1000000'
      - key: PAYER_MAX_FEE_LOVELACE
        value: '2000000'
      - key: PAYER_MAX_ADA_OUTPUT_LOVELACE
        value: '3000000'
