# Candidate deployment configuration. Merge/deploy only after approval of the exact tested SHA.
# The existing database is provisioned separately; paste its private/internal URL into DATABASE_URL.
services:
  - type: web
    name: token2049-origins
    runtime: docker
    branch: main
    region: singapore
    plan: free
    autoDeployTrigger: 'off'
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: APP_ENV
        value: sandbox
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8787
      # Public Storefront authentication; leave the short-lived private delegate unset.
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_API_VERSION
        value: '2026-10'
      - key: SHOPIFY_STOREFRONT_TOKEN
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_STORE_PASSWORD
        sync: false
      - key: SHOPIFY_DEV_STORE_CONFIRMED
        value: 'true'
      - key: SHOPIFY_BOGUS_GATEWAY_ENABLED
        value: 'true'
      - key: SHOPIFY_HEADLESS
        value: 'true'
      # Receive-only Preprod verifier. Payer keys/bridge/ledger never belong on Render.
      - key: CARDANO_NETWORK
        value: cardano:preprod
      - key: CARDANO_FACILITATOR_URL
        sync: false
      - key: CARDANO_TREASURY_ADDRESS
        sync: false
      - key: CARDANO_ASSET_UNIT
        sync: false
      - key: CARDANO_ASSET_DECIMALS
        value: '6'
      - key: BLOCKFROST_PROJECT_ID
        sync: false
      - key: BLOCKFROST_BASE_URL
        value: https://cardano-preprod.blockfrost.io/api/v0
      - key: ATLAS_ALLOW_TEST_BALANCE_PAYMENT
        value: 'false'
