# Apply only after final deployment approval. The gateway and Cardano payer remain existing free services.
services:
  - type: web
    name: t2o-solana-payer
    runtime: docker
    dockerfilePath: ./Dockerfile.solana
    branch: feat/hosted-commerce-completion
    region: singapore
    plan: free
    autoDeployTrigger: 'off'
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SOLANA_SETTLEMENT_MODE
        value: payer_broadcast
      - key: SOLANA_NETWORK
        value: devnet
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: SOLANA_PAYER_RPC_URL
        value: https://api.devnet.solana.com
      - key: SOLANA_USDC_MINT
        value: 4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU
      - key: SOLANA_ASSET_DECIMALS
        value: '6'
      - key: SOLANA_TREASURY_ADDRESS
        sync: false
      - key: SOLANA_TREASURY_TOKEN_ACCOUNT
        sync: false
      - key: SOLANA_FEE_PAYER_ADDRESS
        sync: false
      - key: SOLANA_PAYER_ADDRESS
        sync: false
      - key: SOLANA_PAYER_TOKEN_ACCOUNT
        sync: false
      - key: SOLANA_MAX_PAYMENT_BASE_UNITS
        sync: false
      - key: SOLANA_PAYER_MAX_PURCHASE_BASE_UNITS
        sync: false
      - key: SOLANA_PAYER_MAX_TOTAL_BASE_UNITS
        sync: false
      - key: SOLANA_PAYER_MAX_COMMERCIAL_USD_MINOR
        sync: false
      - key: SOLANA_SPONSOR_MAX_TOTAL_FEE_LAMPORTS
        sync: false
      - key: SOLANA_GATEWAY_URL
        sync: false
      - key: SOLANA_PAYER_BRIDGE_ALLOWED_HOSTS
        sync: false
      - key: SOLANA_PAYER_KEY_FILE
        value: /etc/secrets/solana-payer-key
      - key: SOLANA_SPONSOR_KEY_FILE
        value: /etc/secrets/solana-sponsor-key
      - key: SOLANA_PAYER_BRIDGE_TOKEN_FILE
        value: /etc/secrets/solana-payer-bridge-token
      - key: SOLANA_GATEWAY_TOKEN_FILE
        value: /etc/secrets/solana-payer-gateway-token
      - key: SOLANA_LEGACY_SIGNERS_RETIRED
        value: 'true'
      - key: SOLANA_LEGACY_PAYER_LEDGER_FILE
        value: /etc/secrets/solana-legacy-payer
      - key: SOLANA_LEGACY_SPONSOR_LEDGER_FILE
        value: /etc/secrets/solana-legacy-sponsor
      - key: SOLANA_LEGACY_PAYER_LEDGER_SHA256
        sync: false
      - key: SOLANA_LEGACY_SPONSOR_LEDGER_SHA256
        sync: false
