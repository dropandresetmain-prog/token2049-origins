# Solana-only Blueprint. Creates no public service and does not redeploy the canonical gateway.
# Budget: Starter $7/month + 1 GB disk $0.25/month; verify current pricing before provision.
services:
  - type: pserv
    name: t2o-solana-payer
    runtime: docker
    dockerfilePath: ./Dockerfile.solana
    branch: feat/hosted-solana-mcp
    region: singapore
    plan: starter
    autoDeployTrigger: 'off'
    disk:
      name: solana-histories
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SOLANA_NETWORK
        value: devnet
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: SOLANA_PAYER_RPC_URL
        value: https://api.devnet.solana.com
      - key: SOLANA_USDC_MINT
        value: 4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU
      - key: SOLANA_ASSET_DECIMALS
        value: '6'
      - key: SOLANA_TREASURY_ADDRESS
        sync: false
      - key: SOLANA_TREASURY_TOKEN_ACCOUNT
        sync: false
      - key: SOLANA_FEE_PAYER_ADDRESS
        sync: false
      - key: SOLANA_PAYER_ADDRESS
        sync: false
      - key: SOLANA_PAYER_TOKEN_ACCOUNT
        sync: false
      # Set actual Render Internal hostname plus these exact ports, identically on gateway/payer.
      - key: SOLANA_FACILITATOR_URL
        sync: false
      - key: SOLANA_FACILITATOR_TRUSTED_PRIVATE_ORIGIN
        sync: false
      - key: SOLANA_PAYER_BRIDGE_ALLOWED_HOSTS
        sync: false
      - key: SOLANA_PAYER_BRIDGE_PORT
        value: '8789'
      - key: SOLANA_MAX_PAYMENT_BASE_UNITS
        value: '10000'
      - key: SOLANA_PAYER_MAX_PURCHASE_BASE_UNITS
        value: '10000'
      - key: SOLANA_PAYER_MAX_TOTAL_BASE_UNITS
        value: '10000'
      - key: SOLANA_PAYER_MAX_COMMERCIAL_USD_MINOR
        value: '1000'
      - key: SOLANA_SPONSOR_MAX_TOTAL_FEE_LAMPORTS
        value: '100000'
      - key: SOLANA_LEDGER_DIRECTORY
        value: /var/data/solana
      - key: SOLANA_HOSTED_DATA_DIRECTORY
        value: /var/data/solana
      - key: SOLANA_PAYER_KEY_FILE
        value: /etc/secrets/solana-hosted-payer.json
      - key: SOLANA_SPONSOR_KEY_FILE
        value: /etc/secrets/solana-hosted-sponsor.json
      - key: SOLANA_FACILITATOR_TOKEN_FILE
        value: /etc/secrets/solana-facilitator-token
      - key: SOLANA_PAYER_BRIDGE_TOKEN_FILE
        value: /etc/secrets/solana-payer-bridge-token
      - key: SOLANA_GATEWAY_TOKEN_FILE
        value: /etc/secrets/solana-payer-gateway-token
      - key: SOLANA_GATEWAY_URL
        sync: false
